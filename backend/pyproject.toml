[project]
name = "easyphone-backend"
version = "0.1.0"
description = "EasyPhone AI backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.15.1",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not db'"
markers = [
    "live: real model evals, cost money (run only when asked: uv run pytest -m live)",
    "db: needs a Postgres with the migrations (sh migrations/checks/run_db_tests.sh)",
]
